[package]
name = "minicraft"
version = "0.15.0"
edition = "2021"
description = "A native voxel world explorer with 1/16-metre voxels"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
wgpu = "0.20.1"
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
png = "0.17"
serde_json = "1"
md5 = "0.8"
meshopt = "0.7.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "minicraft"
path = "src/main.rs"
